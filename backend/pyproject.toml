[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orbittrace"
version = "0.1.0"
description = "Local telescope-sequence candidate workbench: bootstrap only"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2,<3", "opencv-python-headless>=4.10,<5", "scipy>=1.14,<2",
  "Pillow>=11,<13", "pydantic>=2.10,<3", "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1", "python-multipart>=0.0.20,<1", "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
astronomy = ["astropy>=7,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "orbittrace*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
